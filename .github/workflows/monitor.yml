name: Monitor ProInnovate

on:
  schedule:
    # Ejecutar cada 6 horas
    - cron: "0 */6 * * *"

  # Permite ejecutarlo manualmente para probar
  workflow_dispatch:

# Permite que GitHub Actions actualice convocatorias.json
permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      # PRUEBA TEMPORAL PARA COMPROBAR TELEGRAM
      - name: Probar Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          import requests

          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"]

          url = f"https://api.telegram.org/bot{token}/sendMessage"

          respuesta = requests.post(
              url,
              data={
                  "chat_id": chat_id,
                  "text": "✅ PRUEBA EXITOSA\n\n🚀 El monitor de ProInnóvate está conectado correctamente con Telegram."
              },
              timeout=30
          )

          print("Código HTTP:", respuesta.status_code)
          print("Respuesta Telegram:", respuesta.text)

          respuesta.raise_for_status()
          PY

      - name: Ejecutar monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py

      - name: Guardar historial
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add convocatorias.json
          git diff --cached --quiet || git commit -m "Actualizar historial de convocatorias"
          git push
