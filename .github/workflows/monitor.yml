name: Monitor ProInnovate

on:
  schedule:
    # Ejecutar cada 6 horas
    - cron: "0 */6 * * *"

  # Permite ejecutarlo manualmente para probar
  workflow_dispatch:

# Permite que GitHub Actions actualice convocatorias.json
permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py

      - name: Guardar historial
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add convocatorias.json
          git diff --cached --quiet || git commit -m "Actualizar historial de convocatorias"
          git push
